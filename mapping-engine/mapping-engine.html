<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4567 Master Pool Mapping Engine</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #f8fafc;
}

header {
  background: #1e3a8a;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 8px 0 0;
  color: #dbeafe;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
}

h2 {
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 220px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #475569;
  background: #0f172a;
  color: white;
  font-size: 16px;
  font-family: monospace;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  font-size: 16px;
  margin-top: 12px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.number {
  background: #334155;
  padding: 9px 13px;
  border-radius: 20px;
  font-weight: bold;
}

.rank {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #334155;
}

.rank:last-child {
  border-bottom: none;
}

.error {
  color: #fca5a5;
  font-weight: bold;
}

.success {
  color: #86efac;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>4567 Master Pool Mapping Engine</h1>
  <p>Rolling 7-Draw → Four 4-Draw Pools → Persistence Mapping</p>
</header>

<div class="container">

  <div class="card">
    <h2>Enter 7 Consecutive CASH5 Draws</h2>

    <p>
      Enter one draw per line using five numbers from 1–35.
    </p>

    <textarea id="drawInput" placeholder="Example:
4 7 16 22 35
3 5 18 27 32
4 5 17 34 35
1 20 22 31 33
1 2 5 9 32
4 9 16 23 26
5 13 14 15 31"></textarea>

    <button onclick="runEngine()">Run Mapping Engine</button>

    <div id="message"></div>
  </div>

  <div id="results"></div>

</div>

<script>

function parseDraws() {

  const text = document.getElementById("drawInput").value.trim();

  if (!text) {
    throw new Error("Please enter seven draws.");
  }

  const lines = text.split(/\n+/);

  if (lines.length !== 7) {
    throw new Error(
      "Exactly 7 consecutive draws are required. You entered " +
      lines.length + "."
    );
  }

  return lines.map((line, index) => {

    const nums = line.match(/\d+/g);

    if (!nums || nums.length !== 5) {
      throw new Error(
        "Draw " + (index + 1) +
        " must contain exactly 5 numbers."
      );
    }

    const draw = nums.map(Number);

    for (const n of draw) {
      if (n < 1 || n > 35) {
        throw new Error(
          "Draw " + (index + 1) +
          " contains a number outside 1–35."
        );
      }
    }

    return [...new Set(draw)].sort((a,b) => a-b);

  });
}


function makePool(draws) {

  const set = new Set();

  draws.forEach(draw => {
    draw.forEach(n => set.add(n));
  });

  return [...set].sort((a,b) => a-b);
}


function runEngine() {

  const message = document.getElementById("message");
  const results = document.getElementById("results");

  message.innerHTML = "";
  results.innerHTML = "";

  try {

    const draws = parseDraws();

    /*
      Seven-draw window:

      D1 D2 D3 D4 D5 D6 D7

      Four rolling 4-draw pools:

      Pool 1 = D1-D4
      Pool 2 = D2-D5
      Pool 3 = D3-D6
      Pool 4 = D4-D7
    */

    const pools = [

      makePool(draws.slice(0,4)),
      makePool(draws.slice(1,5)),
      makePool(draws.slice(2,6)),
      makePool(draws.slice(3,7))

    ];


    /*
      Persistence score:

      A number receives:

      4 = appears in all four pools
      3 = appears in three pools
      2 = appears in two pools
      1 = appears in one pool
    */

    const counts = {};

    for (let n = 1; n <= 35; n++) {
      counts[n] = 0;
    }

    pools.forEach(pool => {

      pool.forEach(n => {
        counts[n]++;
      });

    });


    const groups = {
      4: [],
      3: [],
      2: [],
      1: []
    };

    for (let n = 1; n <= 35; n++) {

      if (counts[n] >= 1) {
        groups[counts[n]].push(n);
      }

    }


    /*
      Build ranked master pool.
      Highest persistence first.
    */

    const ranked = Object.entries(counts)
      .filter(([n,count]) => count > 0)
      .sort((a,b) => {

        if (Number(b[1]) !== Number(a[1])) {
          return Number(b[1]) - Number(a[1]);
        }

        return Number(a[0]) - Number(b[0]);

      });


    let html = "";

    html += `
      <div class="card">
        <h2>Rolling 4-Draw Pools</h2>
    `;

    pools.forEach((pool, i) => {

      html += `<h3>Pool ${i + 1}</h3>`;

      html += `<div class="pool">`;

      pool.forEach(n => {
        html += `<span class="number">${n}</span>`;
      });

      html += `</div>`;

    });

    html += `</div>`;


    html += `
      <div class="card">
        <h2>Persistence Groups</h2>
    `;

    [4,3,2,1].forEach(score => {

      html += `
        <h3>${score}/4 Persistence</h3>
        <div class="pool">
      `;

      if (groups[score].length === 0) {

        html += `<span>None</span>`;

      } else {

        groups[score].forEach(n => {

          html += `<span class="number">${n}</span>`;

        });

      }

      html += `</div>`;

    });

    html += `</div>`;


    html += `
      <div class="card">
        <h2>Ranked Master Pool</h2>
        <p class="success">
          Numbers ranked by rolling-pool persistence
        </p>
    `;

    ranked.forEach(([n,count], index) => {

      html += `
        <div class="rank">
          <span>#${index + 1} — Number ${n}</span>
          <strong>${count}/4</strong>
        </div>
      `;

    });

    html += `</div>`;


    html += `
      <div class="card">
        <h2>Current Master Pool</h2>
        <div class="pool">
    `;

    ranked.forEach(([n]) => {

      html += `<span class="number">${n}</span>`;

    });

    html += `
        </div>
      </div>
    `;


    results.innerHTML = html;

    message.innerHTML =
      `<p class="success">✓ Mapping engine completed successfully.</p>`;

  }

  catch(error) {

    message.innerHTML =
      `<p class="error">⚠ ${error.message}</p>`;

  }

}

</script>

</body>
</html>
